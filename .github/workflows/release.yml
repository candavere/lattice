name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            rid: linux-x64
            name: lattice-linux-x64
          - os: windows-latest
            rid: win-x64
            name: lattice-win-x64.exe
          - os: macos-latest
            rid: osx-arm64
            name: lattice-osx-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file self-contained binary
        # NB: no -p:AssemblyName here. Command-line overrides of AssemblyName
        # make NuGet restore treat the name as a project key, which surfaces as
        # "Ambiguous project name '<assembly>'" on every RID leg. Publish under
        # the default assembly name and rename in a dedicated step instead.
        run: dotnet publish Cli/Lattice.Cli.csproj -c Release --self-contained true -r ${{ matrix.target.rid }} -p:PublishSingleFile=true -o publish

      - name: Rename binary to release artifact name
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv publish/lattice.exe publish/${{ matrix.target.name }}
          else
            mv publish/lattice publish/${{ matrix.target.name }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: publish/lattice-*
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*