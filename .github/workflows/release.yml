name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # P0: gate every release on tag/project/CLI version parity and the exact
  # checked-out commit before any native asset is built. A tag that disagrees
  # with the source tree — or a build whose release metadata would not target
  # the triggering commit — must never reach the publish matrix.
  validate:
    name: Tag/project version parity gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Assert tag version == every project <Version> == CLI --version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "tag version: $TAG_VERSION"
          echo "checked-out commit SHA: ${GITHUB_SHA}"
          if [ -z "${GITHUB_SHA:-}" ]; then
            echo "::error::GITHUB_SHA is empty; release cannot target a commit"
            exit 1
          fi

          # The 8 production/test projects that must agree with the tag. The
          # reference/ scaffold is intentionally excluded: it is not shipped.
          PROJECTS="
            Environment/Lattice.Environment.csproj
            Agents/Lattice.Agents.csproj
            Trajectories/Lattice.Trajectories.csproj
            Analytics/Lattice.Analytics.csproj
            Visualization/Lattice.Visualization.csproj
            Cli/Lattice.Cli.csproj
            Generator/Lattice.Generator.csproj
            Tests/Lattice.Tests.csproj
          "

          # Verify EVERY <Version> element in every project, not just the first.
          for proj in $PROJECTS; do
            test -f "$proj" || { echo "::error::missing project $proj"; exit 1; }
            MATCHES="$(grep -c '<Version>' "$proj" || true)"
            if [ "$MATCHES" -eq 0 ]; then
              echo "::error::$proj declares no <Version> element"
              exit 1
            fi
            while IFS= read -r line; do
              PROJ_VERSION="$(printf '%s' "$line" | sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' | tr -d '[:space:]')"
              echo "  $proj -> $PROJ_VERSION"
              if [ -z "$PROJ_VERSION" ] || [ "$PROJ_VERSION" != "$TAG_VERSION" ]; then
                echo "::error::$proj declares version '$PROJ_VERSION', expected '$TAG_VERSION'"
                exit 1
              fi
            done < <(grep '<Version>' "$proj")
          done

          echo "building CLI to read its reported version..."
          dotnet build Cli/Lattice.Cli.csproj -c Release
          CLI_VERSION="$(dotnet run -c Release --project Cli --no-build -- --version | tr -d '\r' | tail -n1)"
          echo "cli --version: $CLI_VERSION"
          if [ "$CLI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::CLI --version '$CLI_VERSION' does not match tag '$TAG_VERSION'"
            exit 1
          fi

          echo "version parity verified: tag=$TAG_VERSION cli=$CLI_VERSION commit=${GITHUB_SHA}"

  # P0: build the exact release assets, exercise each one natively on its own
  # runner, hash the smoke-tested bytes, and upload only the artifacts that
  # passed. The release job re-verifies those downloaded bytes against the
  # checksums captured here, so the hashes cover the exact tested binaries.
  publish:
    name: Build, smoke test, and stage ${{ matrix.target.name }}
    needs: validate
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-24.04
            rid: linux-x64
            name: lattice-linux-x64
          - os: windows-latest
            rid: win-x64
            name: lattice-win-x64.exe
          - os: macos-latest
            rid: osx-arm64
            name: lattice-osx-arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file binary
        # NB: no -p:AssemblyName here. Command-line overrides of AssemblyName
        # make NuGet restore treat the name as a project key, which surfaces as
        # "Ambiguous project name '<assembly>'" on every RID leg. Publish under
        # the default assembly name and rename in a dedicated step instead.
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish Cli/Lattice.Cli.csproj -c Release \
            --self-contained true \
            -r ${{ matrix.target.rid }} \
            -p:PublishSingleFile=true \
            -o publish

      - name: Rename binary to release artifact name
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv publish/lattice.exe publish/${{ matrix.target.name }}
          else
            mv publish/lattice publish/${{ matrix.target.name }}
          fi

      - name: Smoke test the exact native asset
        shell: bash
        run: |
          set -euo pipefail
          BIN="publish/${{ matrix.target.name }}"
          chmod +x "$BIN" || true

          EXPECTED_VERSION="${GITHUB_REF#refs/tags/v}"

          echo "== $BIN --help =="
          "$BIN" --help

          echo "== $BIN --version =="
          VERSION_OUTPUT="$("$BIN" --version | tr -d '\r' | tail -n1)"
          echo "reported version: $VERSION_OUTPUT"
          if [ "$VERSION_OUTPUT" != "$EXPECTED_VERSION" ]; then
            echo "::error::$BIN reported '$VERSION_OUTPUT', expected '$EXPECTED_VERSION'"
            exit 1
          fi

          echo "== $BIN simulate --steps 10 --seed 42 =="
          "$BIN" simulate --steps 10 --seed 42 > /dev/null

          echo "== $BIN simulate --rules Tests/fixtures/golden_dynamic_rules.json --steps 10 --seed 42 =="
          "$BIN" simulate --rules Tests/fixtures/golden_dynamic_rules.json --steps 10 --seed 42 > /dev/null

          echo "== $BIN replay Tests/fixtures/golden_trajectory.jsonl --verify =="
          "$BIN" replay Tests/fixtures/golden_trajectory.jsonl --verify

          echo "== $BIN evaluate --scenario standard --seeds 2 --rollouts 8 =="
          "$BIN" evaluate --scenario standard --seeds 2 --rollouts 8

          echo "== $BIN evaluate --scenario bottleneck --seeds 2 --rollouts 8 =="
          "$BIN" evaluate --scenario bottleneck --seeds 2 --rollouts 8

          echo "native smoke matrix passed for ${{ matrix.target.name }}"

      - name: Hash the smoke-tested binary
        shell: bash
        run: |
          set -euo pipefail
          # cd into publish/ so the recorded path is just the basename. When the
          # release job later runs `sha256sum -c` from the flat artifacts/ dir,
          # the checksum must not embed the stale `publish/` prefix.
          (cd publish && sha256sum "${{ matrix.target.name }}" > "${{ matrix.target.name }}.sha256")
          cat "publish/${{ matrix.target.name }}.sha256"

      - name: Upload the smoke-tested asset and its checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.target.name }}
          path: |
            publish/${{ matrix.target.name }}
            publish/${{ matrix.target.name }}.sha256
          if-no-files-found: error

  # Release job: download the exact tested artifacts, regenerate and verify
  # SHA256SUMS.txt over those downloaded bytes, generate the CycloneDX SBOM,
  # compose a formal structured release body, then attach everything to the
  # GitHub Release for the immutable tag.
  release:
    name: Verify, compose, and attach release assets
    needs: publish
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Download all smoke-tested binaries and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify downloaded artifacts against smoke-tested checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          echo "regenerating SHA256SUMS.txt over the downloaded bytes:"
          sha256sum lattice-linux-x64 lattice-win-x64.exe lattice-osx-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "verifying downloaded artifacts match the smoke-tested hashes:"
          sha256sum -c lattice-linux-x64.sha256 lattice-win-x64.exe.sha256 lattice-osx-arm64.sha256
          echo "all downloaded artifacts match their smoke-tested checksums"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Restore (for SBOM dependency graph)
        run: dotnet restore Lattice.sln

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          dotnet tool install --global CycloneDX --version 6.2.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          # The tool uses the filename verbatim, so name the artifact directly
          # and force JSON (the CycloneDX default is XML).
          dotnet CycloneDX Lattice.sln -o artifacts -fn sbom.json -F Json \
            -sn Lattice -sv "$TAG_VERSION"
          test -f artifacts/sbom.json

      - name: Compose formal structured release body
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          COMMIT="${GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT:0:8}"
          cat > RELEASE_NOTES.md <<EOF
          # Lattice $TAG

          **Source**
          - Version tag: \`v$TAG\`
          - Source commit: \`$COMMIT\` (\`$SHORT_COMMIT\`)
          - Status: Research Preview — evaluation by maintainers and collaborators.

          ## Compatibility & schema
          - Pure .NET 10 (net10.0) BCL runtime; no external native dependencies.
          - **Current trajectory schema version is \`5\`** (\`TrajectorySchema.CurrentVersion\`). Recordings written by this build are stamped 5.
          - **Schemas 0 through 5 all read, replay and verify**, so older files are not rejected and not rewritten: an absent optional field is simply absent, and \`Write\` re-emits each recording's own header version rather than relabelling it.
          - Schema 3 introduced the mandatory per-tick \`StateHash\`; schema 4 added decision-time \`Perceptions\` and \`AgentVision\`; schema 5 added the optional header field \`ScenarioSha256\`, the SHA-256 of the scenario descriptor's exact source bytes. Schema 5 changes nothing else — map, config, step lines, state hashes and perceptions are as schema 4 left them.
          - The smoke-tested \`Tests/fixtures/golden_trajectory.jsonl\` is **deliberately retained at schema 3** (header \`SchemaVersion: 3\`, 12 steps), not migrated to 5. Its job is to be the cross-platform gate's standing proof that a pre-perception recording is still read and still verified **silently**, and re-recording it would destroy the property it exists to hold. The reader's missing-perception notice fires only at schema 4 or later and **stays silent below it**, because a pre-perception recording never carried the field; a schema-4-or-later recording without it is reported as a notice, never as a discrepancy.
          - \`ScenarioSha256\` is **provenance, not an assertion replay can check**: the recording stays self-contained and never reopens the descriptor, so a schema-5 recording missing its digest still verifies and reports \`no scenario digest: the recording does not name the descriptor that produced it\`. That is deliberately unlike the state hash, whose absence from a schema-3-or-later recording is a discrepancy, because the state hash is something replay recomputes and compares. The two are computed over different things and are never compared to each other.
          - Determinism is scoped to serialized \`StepResult\` equivalence **plus** the per-tick state hash that schema 3 introduced: \`replay --verify\` re-serializes each \`StepResult\` and recomputes the SHA-256 digest of each tick's end-of-tick simulation state, naming the first mismatched tick. This is per-step serialized equivalence plus per-tick digest equality, **not** raw byte identity. See [docs/SUPPORT_AND_REPRODUCIBILITY.md](https://github.com/candavere/lattice/blob/$COMMIT/docs/SUPPORT_AND_REPRODUCIBILITY.md).
          - Schema constants are read from [Trajectories/TrajectoryModel.cs](https://github.com/candavere/lattice/blob/$COMMIT/Trajectories/TrajectoryModel.cs); the read/verify rules are in [Trajectories/TrajectoryReplay.cs](https://github.com/candavere/lattice/blob/$COMMIT/Trajectories/TrajectoryReplay.cs).

          ## Supported matrix
          | Asset | OS | Architecture | Runtime |
          | --- | --- | --- | --- |
          | \`lattice-linux-x64\` | Linux | x64 | .NET 10 self-contained |
          | \`lattice-osx-arm64\` | macOS | arm64 | .NET 10 self-contained |
          | \`lattice-win-x64.exe\` | Windows | x64 | .NET 10 self-contained |

          ## Assets
          - Binaries (smoke-tested on their native runners): \`lattice-linux-x64\`, \`lattice-osx-arm64\`, \`lattice-win-x64.exe\`
          - Checksums: \`SHA256SUMS.txt\`
          - Software bill of materials: \`sbom.json\` (CycloneDX, JSON)

          ## Benchmark, smoke-test, and evaluation artifacts
          - Smoke matrix (each binary on its own runner): \`--help\`, \`--version\`, \`simulate\` (default and \`--rules\`), \`replay --verify\`, and \`evaluate\` (standard + bottleneck).
          - Evaluation artifacts: [bottleneck](https://github.com/candavere/lattice/blob/$COMMIT/benchmarks/bottleneck_evaluation_results.json) · [MCTS](https://github.com/candavere/lattice/blob/$COMMIT/benchmarks/mcts_evaluation_results.json)
          - Throughput benchmark: [summary](https://github.com/candavere/lattice/blob/$COMMIT/benchmarks/throughput_summary.md) · [raw](https://github.com/candavere/lattice/blob/$COMMIT/benchmarks/throughput_benchmark.json)
          - Throughput is a **host-scoped, narrow claim**. Two distinct gates are easy to confuse, and they are not the same claim:
            - The **runner-class gate** is the strict verdict. It adjudicates only on a full host-fingerprint match (OS family, architecture, .NET runtime major, logical cores, CPU model) under a matching recorded protocol budget, and arms **4 of its 5** workloads at allowed ratios 0.7804–0.8416, derived from a 20-session hosted-runner cohort on pinned commit \`1b9426f5\`.
            - A comparison against the **committed bare-metal baseline** is a different gate. On a host mismatch it is **informational only** — a cross-host table plus the structural checks, never a throughput verdict.
          - \`policy_lookahead_mcts_32\` is a deliberate permanent non-verdict on this runner class (20 sessions span 2.050× max/min, too wide to separate a real regression from jitter). It is measured, printed and compared but carries no verdict. This is a recorded negative result, not a gap to close by widening a tolerance ([FINDING-014](https://github.com/candavere/lattice/blob/$COMMIT/docs/FINDINGS_LEDGER.md)). The bare-metal research reference is a separate record and is unaffected.
          - Test totals are published per operating system as CI artifacts and are **never summed across operating systems**; there is deliberately no repository-wide "N tests" figure, because a static count goes stale silently. Read the artifact for the exact commit you are looking at. See [README, Test totals](https://github.com/candavere/lattice/blob/$COMMIT/README.md#test-totals-as-ci-publishes-them).
          - Benchmark policy and thresholds: [docs/BENCHMARKING.md](https://github.com/candavere/lattice/blob/$COMMIT/docs/BENCHMARKING.md).

          ## Known limitations
          - Research Preview: behaviors, defaults, and output formats may change without deprecation notice.
          - Determinism guarantees apply to serialized \`StepResult\` equivalence plus the per-tick simulation-state hash introduced in schema 3, not bit-identical replay across runtime/host.
          - The scenario digest (schema 5) is not part of the determinism guarantee: it names the descriptor that produced a run, and replay cannot recompute it from a self-contained recording.
          - Fixture schema versions are not the current schema version. The retained golden fixture and \`site/demo.jsonl\` are schema 3 by design; \`site/infiltration.jsonl\` is schema 5 and \`Tests/fixtures/legacy/infiltration_schema4.jsonl\` is schema 4. All four verify under the schema-5 reader.
          - Limited OS coverage: x64 Linux, arm64 macOS, x64 Windows only; no 32-bit or arm64 Linux builds in this release.

          ## Checksums
          \`\`\`
          $(cd artifacts && sha256sum lattice-linux-x64 lattice-win-x64.exe lattice-osx-arm64)
          \`\`\`

          SBOM (\`sbom.json\`) enumerates the .NET 10 dependency graph; verify every artifact against \`SHA256SUMS.txt\` before use.
          EOF
          cat RELEASE_NOTES.md

      - name: Attach binaries, SHA256SUMS.txt, sbom.json, and release body
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231
        with:
          files: |
            artifacts/*
          body_path: RELEASE_NOTES.md