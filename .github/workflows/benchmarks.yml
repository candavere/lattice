name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: "Measured iterations per workload (default 10)"
        required: false
        default: "10"
      steps:
        description: "Ticks per iteration for the raw cases (default 100000, matching the committed baseline protocol)"
        required: false
        default: "100000"
      warmup:
        description: "Warm-up budget in ticks (default 50000)"
        required: false
        default: "50000"

jobs:
  comparator-tests:
    # The pass/fail decisions of the comparison script power both jobs below,
    # so they are unit-tested on every push/PR: fingerprint arming, cv-derived
    # tolerances, per-workload overrides, exit codes, and the structural smoke
    # classification.
    name: Decision comparator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unit-test the benchmark decision comparator
        shell: bash
        run: |
          python3 -m unittest discover -s .github/workflows -p 'test_*.py'

  regression-gate:
    name: Regression gate vs committed baseline (macOS arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10 (baseline runtime)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Cli/Lattice.Cli.csproj -c Release

      - name: Bench the five-case matrix
        shell: bash
        run: |
          RUNS="${{ inputs.runs || '10' }}"
          STEPS="${{ inputs.steps || '100000' }}"
          WARMUP="${{ inputs.warmup || '50000' }}"
          dotnet run -c Release --project Cli -- benchmark \
            --runs "$RUNS" --steps "$STEPS" --warmup "$WARMUP" \
            --out "$RUNNER_TEMP/throughput.json"

      # The committed baseline is recorded on a bare-metal Apple M1 (a
      # conservative reference), while shared macos-26 runners virtualize the
      # CPU and are subject to frequency-scaling and scheduler jitter - worst
      # on the sub-microsecond tight loop. Two safeguards keep the gate honest
      # without letting runner variance masquerade as a regression:
      #   1. the measurement protocol matches the baseline recording (100k
      #      steps per measured iteration), so per-sample noise is not inflated
      #      by a shortened budget;
      #   2. a sub-threshold dip is re-measured once - a transient jitter spike
      #      clears on the retry pass, a real regression fails both passes.
      # Tolerances: 0.75x for the engine-stepping matrix (a 25% drop is the
      # actionable floor on a virtualized host), 0.6x for the
      # jitter-dominated micro loop, and a stricter 0.85x for the long-loop
      # rollout-search workload which amortizes host noise per ~5ms decision.
      - name: Compare against committed baseline (retry once on runner jitter)
        shell: bash
        run: |
          set -u
          RUNS="${{ inputs.runs || '10' }}"
          STEPS="${{ inputs.steps || '100000' }}"
          WARMUP="${{ inputs.warmup || '50000' }}"
          COMPARE() {
            python3 .github/workflows/compare_benchmarks.py \
              benchmarks/throughput_benchmark.json \
              "$RUNNER_TEMP/throughput.json" \
              --threshold 0.75 \
              --per-workload-threshold micro_raw_2agent=0.6 \
              --per-workload-threshold policy_lookahead_mcts_32=0.85 \
              --no-annotations \
              --strict-if-matching
          }
          FIRST="$(COMPARE)" && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "$FIRST"
            exit 0
          fi
          echo "$FIRST"
          echo "::warning::first pass flagged a throughput dip; re-measuring " \
            "once to rule out shared-runner jitter"
          dotnet run -c Release --project Cli -- benchmark \
            --runs "$RUNS" --steps "$STEPS" --warmup "$WARMUP" \
            --out "$RUNNER_TEMP/throughput.json"
          SECOND="$(COMPARE)" && rc=0 || rc=$?
          echo "$SECOND"
          exit "$rc"

      # Uploaded with if: always() so the measured runner numbers survive a
      # failed gate and stay recoverable without log access.
      - name: Upload the measured comparison artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: throughput-macos-arm64
          path: ${{ runner.temp }}/throughput.json
          if-no-files-found: warn

  runner-class-gate:
    # The hosted-runner reference is its own record, measured on this runner
    # class, because the bare-metal record is a different host class and can
    # only ever be an informational cross-host comparison here. The record
    # benchmarks/runner_class_throughput_benchmark.json was collected as five
    # full-protocol sessions on the same tree; its Provenance block carries
    # the measured between-run spread and the per-workload allowed ratios
    # derived from it, so the tolerances below are read from that evidence
    # rather than from a within-run sample dispersion that understates hosted
    # jitter by roughly 4x.
    #
    # The record also declares Provenance.ArmedWorkloads: policy_lookahead_mcts_32
    # measured a 1.81x between-run spread, too wide to separate a real
    # regression from runner jitter, so it is reported and never adjudicated.
    # The gate arms only on a full fingerprint match (OS family, architecture,
    # .NET runtime major, logical cores, CPU model) and a matching recorded
    # protocol; anything else degrades to an informational cross-host table.
    #
    # The bounded retry is kept deliberately: a single re-measure clears a
    # transient dip, while a dip that persists across both passes is a real
    # signal. A pinned label is not a pinned image, so an image build that
    # shifts throughput systematically will present here as a regression; the
    # remedy is to re-collect the record (see benchmarks/runner_class_summary.md).
    name: Runner-class gate vs hosted-runner reference (macos-26 arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10 (runner-class baseline runtime)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Cli/Lattice.Cli.csproj -c Release

      - name: Bench the five-case matrix (full protocol)
        shell: bash
        run: |
          RUNS="${{ inputs.runs || '10' }}"
          STEPS="${{ inputs.steps || '100000' }}"
          WARMUP="${{ inputs.warmup || '50000' }}"
          dotnet run -c Release --project Cli -- benchmark \
            --runs "$RUNS" --steps "$STEPS" --warmup "$WARMUP" \
            --out "$RUNNER_TEMP/runner-class.json"

      - name: Compare against the runner-class record (retry once on jitter)
        shell: bash
        run: |
          set -u
          RUNS="${{ inputs.runs || '10' }}"
          STEPS="${{ inputs.steps || '100000' }}"
          WARMUP="${{ inputs.warmup || '50000' }}"
          COMPARE() {
            python3 .github/workflows/compare_benchmarks.py \
              benchmarks/runner_class_throughput_benchmark.json \
              "$RUNNER_TEMP/runner-class.json" \
              --per-workload-threshold micro_raw_2agent=0.787 \
              --per-workload-threshold facility_static_4agent=0.911 \
              --per-workload-threshold dynamic_contention_4agent=0.799 \
              --per-workload-threshold stress_topology_4agent=0.806 \
              --no-annotations \
              --strict-if-matching
          }
          FIRST="$(COMPARE)" && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "$FIRST"
            exit 0
          fi
          echo "$FIRST"
          echo "::warning::first pass flagged a throughput dip; re-measuring " \
            "once to rule out shared-runner jitter"
          dotnet run -c Release --project Cli -- benchmark \
            --runs "$RUNS" --steps "$STEPS" --warmup "$WARMUP" \
            --out "$RUNNER_TEMP/runner-class.json"
          SECOND="$(COMPARE)" && rc=0 || rc=$?
          echo "$SECOND"
          exit "$rc"

      - name: Upload the runner-class measurement
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runner-class-macos-arm64
          path: ${{ runner.temp }}/runner-class.json
          if-no-files-found: warn

  cross-host-structure:
    # Deliberately on .NET 8 / ubuntu x64: this job is a structural smoke. Its
    # runtime differs from the committed baseline, and it runs a bounded smoke
    # pass (3 runs / 10k steps), so its throughput is NOT comparable to the
    # full-protocol .NET 10 baseline. The comparison is therefore reclassified
    # as a structural smoke (--smoke): the comparator verifies the workload
    # matrix and positive medians but never adjudicates a throughput ratio, so
    # a cross-runtime delta can never masquerade as a regression.
    name: Cross-host structural smoke (ubuntu x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Cli/Lattice.Cli.csproj -c Release

      - name: Bench (bounded smoke pass)
        shell: bash
        run: |
          dotnet run -c Release --project Cli -- benchmark \
            --runs 3 --steps 10000 --warmup 10000 \
            --out "$RUNNER_TEMP/throughput.json"

      - name: Classify the smoke artifact against the committed baseline
        shell: bash
        run: |
          python3 .github/workflows/compare_benchmarks.py \
            benchmarks/throughput_benchmark.json \
            "$RUNNER_TEMP/throughput.json" \
            --smoke