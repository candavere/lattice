<svg width="400" height="470" viewBox="0 0 400 470" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Lattice</title>
  <desc>Animated logo for Lattice: a hexagonal network of six zones around a central node, connected by choke-point edges, with a traveling pulse representing deterministic simulation ticks.</desc>

  <defs>
    <!-- reusable flat-top hexagon, r=22, centered at origin -->
    <polygon id="hex" points="22,0 11,19.05 -11,19.05 -22,0 -11,-19.05 11,-19.05" />

    <marker id="dot" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="5" refY="5">
      <circle cx="5" cy="5" r="5" fill="#f5a623" />
    </marker>
  </defs>

  <style>
    .bg { fill: none; }
    .spoke { stroke: #2a3a4a; stroke-width: 1.4; fill: none; }
    .ring { stroke: #1fb6a6; stroke-width: 2.2; fill: none; stroke-linejoin: round; }
    .ring-dash {
      stroke-dasharray: 14 10;
      animation: march 3.6s linear infinite;
    }
    @keyframes march {
      to { stroke-dashoffset: -480; }
    }

    .node-center { fill: #0e1a24; stroke: #1fb6a6; stroke-width: 2.4; transform-origin: 200px 195px; animation: beat 2.4s ease-in-out infinite; }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .core-dot { fill: #1fb6a6; animation: coreglow 2.4s ease-in-out infinite; }
    @keyframes coreglow {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    .node-outer {
      fill: #0e1a24;
      stroke: #3d5a68;
      stroke-width: 2;
      opacity: 0;
      animation: reveal 0.6s ease-out forwards, drift 5s ease-in-out infinite;
      animation-delay: var(--d, 0s), calc(var(--d, 0s) + 0.6s);
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes reveal {
      from { opacity: 0; transform: scale(0.4); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes drift {
      0%, 100% { stroke: #3d5a68; }
      50% { stroke: #1fb6a6; }
    }

    .pulse {
      fill: #f5a623;
      offset-rotate: 0deg;
      animation: run 3.6s linear infinite;
      animation-delay: var(--pd, 0s);
    }
    @keyframes run {
      0%   { offset-distance: 0%; opacity: 0; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    .wordmark { font-family: "SF Mono", "Consolas", "Menlo", monospace; fill: #d7e2e8; letter-spacing: 6px; }
    .tagline { font-family: "SF Mono", "Consolas", "Menlo", monospace; fill: #5c7684; letter-spacing: 1.5px; }
  </style>

  <rect class="bg" width="400" height="470" />

  <!-- spokes: center to each of the six zones -->
  <g class="spoke">
    <line x1="200" y1="195" x2="200" y2="100" />
    <line x1="200" y1="195" x2="282.3" y2="147.5" />
    <line x1="200" y1="195" x2="282.3" y2="242.5" />
    <line x1="200" y1="195" x2="200" y2="290" />
    <line x1="200" y1="195" x2="117.7" y2="242.5" />
    <line x1="200" y1="195" x2="117.7" y2="147.5" />
  </g>

  <!-- hex ring: choke-point edges connecting the six zones -->
  <polygon class="ring ring-dash"
    points="200,100 282.3,147.5 282.3,242.5 200,290 117.7,242.5 117.7,147.5" />
  <path id="track" class="bg"
    d="M200,100 282.3,147.5 282.3,242.5 200,290 117.7,242.5 117.7,147.5 Z" />

  <!-- travelling tick pulses along the ring -->
  <circle r="4.5" class="pulse" style="offset-path: path('M200,100 282.3,147.5 282.3,242.5 200,290 117.7,242.5 117.7,147.5 Z'); --pd:0s;" />
  <circle r="4.5" class="pulse" style="offset-path: path('M200,100 282.3,147.5 282.3,242.5 200,290 117.7,242.5 117.7,147.5 Z'); --pd:1.2s;" />
  <circle r="4.5" class="pulse" style="offset-path: path('M200,100 282.3,147.5 282.3,242.5 200,290 117.7,242.5 117.7,147.5 Z'); --pd:2.4s;" />

  <!-- six outer zone nodes -->
  <use href="#hex" x="200" y="100"   class="node-outer" style="--d:0.05s" />
  <use href="#hex" x="282.3" y="147.5" class="node-outer" style="--d:0.2s" />
  <use href="#hex" x="282.3" y="242.5" class="node-outer" style="--d:0.35s" />
  <use href="#hex" x="200" y="290"   class="node-outer" style="--d:0.5s" />
  <use href="#hex" x="117.7" y="242.5" class="node-outer" style="--d:0.65s" />
  <use href="#hex" x="117.7" y="147.5" class="node-outer" style="--d:0.8s" />

  <!-- central node -->
  <use href="#hex" x="200" y="195" class="node-center" />
  <circle cx="200" cy="195" r="5.5" class="core-dot" />

  <!-- wordmark -->
  <text x="200" y="375" text-anchor="middle" class="wordmark" font-size="30" font-weight="600">LATTICE</text>
  <text x="200" y="404" text-anchor="middle" class="tagline" font-size="12">deterministic tactical simulation</text>
</svg>
