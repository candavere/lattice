<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>The map changes which policy wins</title>
  <desc>Same two policies, MCTS and Scout, evaluated on two map distributions. Standard maps: MCTS loses to Scout, mean paired delta −1.12, 95% CI [−1.37, −0.87]. Bottleneck maps: MCTS wins over Scout, mean paired delta +1.42, 95% CI [+1.11, +1.73]. Environment conditions change which policy wins.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: 3px; fill: #7d8590; }
    .headline { font-size: 42px; font-weight: 700; fill: #e6edf3; }
    .subhead { font-size: 25px; fill: #9da7b1; }
    .panel-label { font-size: 22px; font-weight: 600; fill: #8b949e; }
    .panel-result { font-size: 33px; font-weight: 700; fill: #e6edf3; }
    .panel-delta { font-size: 28px; font-weight: 700; }
    .panel-ci { font-size: 22px; fill: #9da7b1; }
    .conclusion { font-size: 26px; font-weight: 600; fill: #e6edf3; }
    .footer { font-size: 13px; fill: #6e7681; }
  </style>

  <defs>
    <clipPath id="panel1"><rect x="56" y="190" width="848" height="124" rx="12" /></clipPath>
    <clipPath id="panel2"><rect x="56" y="328" width="848" height="124" rx="12" /></clipPath>
  </defs>

  <!-- canvas -->
  <rect width="960" height="560" rx="16" fill="#0d1117" stroke="#30363d" />

  <!-- header -->
  <text x="56" y="62" class="eyebrow">COMMITTED EXPERIMENT</text>
  <text x="56" y="110" class="headline">The map changes which policy wins</text>
  <text x="56" y="152" class="subhead">Same two policies. Different environment conditions.</text>

  <!-- panel 1: standard maps -->
  <rect x="56" y="190" width="848" height="124" rx="12" fill="#161b22" stroke="#30363d" />
  <g clip-path="url(#panel1)">
    <rect x="56" y="190" width="6" height="124" fill="#ff7b72" />
  </g>
  <text x="82" y="234" class="panel-label">Standard maps</text>
  <text x="82" y="286" class="panel-result">MCTS loses to Scout</text>
  <text x="878" y="234" text-anchor="end" class="panel-delta" fill="#ff7b72">Mean paired delta −1.12</text>
  <text x="878" y="286" text-anchor="end" class="panel-ci">95% CI [−1.37, −0.87]</text>

  <!-- panel 2: bottleneck maps -->
  <rect x="56" y="328" width="848" height="124" rx="12" fill="#161b22" stroke="#30363d" />
  <g clip-path="url(#panel2)">
    <rect x="56" y="328" width="6" height="124" fill="#3fbfb2" />
  </g>
  <text x="82" y="372" class="panel-label">Bottleneck maps</text>
  <text x="82" y="424" class="panel-result">MCTS wins over Scout</text>
  <text x="878" y="372" text-anchor="end" class="panel-delta" fill="#3fbfb2">Mean paired delta +1.42</text>
  <text x="878" y="424" text-anchor="end" class="panel-ci">95% CI [+1.11, +1.73]</text>

  <!-- conclusion -->
  <rect x="56" y="466" width="848" height="48" rx="12" fill="#161b22" stroke="#30363d" />
  <text x="480" y="499" text-anchor="middle" class="conclusion">Environment conditions change which policy wins.</text>

  <!-- footer -->
  <text x="56" y="542" class="footer">Sources: benchmarks/mcts_evaluation_results.json (standard) · benchmarks/bottleneck_evaluation_results.json (bottleneck)</text>
</svg>