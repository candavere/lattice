name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: "Measured iterations per workload (default 10)"
        required: false
        default: "10"
      steps:
        description: "Ticks per iteration for the raw cases (default 100000, matching the committed baseline protocol)"
        required: false
        default: "100000"
      warmup:
        description: "Warm-up budget in ticks (default 50000)"
        required: false
        default: "50000"

jobs:
  regression-gate:
    name: Regression gate vs committed baseline (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 (baseline runtime)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Cli/Lattice.Cli.csproj -c Release

      - name: Bench the five-case matrix
        shell: bash
        run: |
          RUNS="${{ inputs.runs || '10' }}"
          STEPS="${{ inputs.steps || '100000' }}"
          WARMUP="${{ inputs.warmup || '50000' }}"
          dotnet run -c Release --project Cli -- benchmark \
            --runs "$RUNS" --steps "$STEPS" --warmup "$WARMUP" \
            --out "$RUNNER_TEMP/throughput.json"

      # The committed baseline is recorded on a bare-metal Apple M1 (a
      # conservative reference), while shared macos-14 runners virtualize the
      # CPU and are subject to frequency-scaling and scheduler jitter - worst
      # on the sub-microsecond tight loop. Two safeguards keep the gate honest
      # without letting runner variance masquerade as a regression:
      #   1. the measurement protocol matches the baseline recording (100k
      #      steps per measured iteration), so per-sample noise is not inflated
      #      by a shortened budget;
      #   2. a sub-threshold dip is re-measured once - a transient jitter spike
      #      clears on the retry pass, a real regression fails both passes.
      # Tolerances: 0.75x for the engine-stepping matrix (a 25% drop is the
      # actionable floor on a virtualized host), 0.6x for the
      # jitter-dominated micro loop, and a stricter 0.85x for the long-loop
      # rollout-search workload which amortizes host noise per ~5ms decision.
      - name: Compare against committed baseline (retry once on runner jitter)
        shell: bash
        run: |
          set -u
          RUNS="${{ inputs.runs || '10' }}"
          STEPS="${{ inputs.steps || '100000' }}"
          WARMUP="${{ inputs.warmup || '50000' }}"
          COMPARE() {
            python3 .github/workflows/compare_benchmarks.py \
              benchmarks/throughput_benchmark.json \
              "$RUNNER_TEMP/throughput.json" \
              --threshold 0.75 \
              --per-workload-threshold micro_raw_2agent=0.6 \
              --per-workload-threshold policy_lookahead_mcts_32=0.85 \
              --no-annotations \
              --strict-if-matching
          }
          FIRST="$(COMPARE)" && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "$FIRST"
            exit 0
          fi
          echo "$FIRST"
          echo "::warning::first pass flagged a throughput dip; re-measuring " \
            "once to rule out shared-runner jitter"
          dotnet run -c Release --project Cli -- benchmark \
            --runs "$RUNS" --steps "$STEPS" --warmup "$WARMUP" \
            --out "$RUNNER_TEMP/throughput.json"
          SECOND="$(COMPARE)" && rc=0 || rc=$?
          echo "$SECOND"
          exit "$rc"

  cross-host-structure:
    # Deliberately on .NET 8 / ubuntu x64: this job is a structural smoke and
    # an informational cross-host comparison. Its runtime differs from the
    # committed baseline, so it must never fail on throughput - the compare
    # script only arms the strict threshold for a matching OS family +
    # architecture + .NET runtime major.
    name: Cross-host structural smoke (ubuntu x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Cli/Lattice.Cli.csproj -c Release

      - name: Bench (bounded smoke pass)
        shell: bash
        run: |
          dotnet run -c Release --project Cli -- benchmark \
            --runs 3 --steps 10000 --warmup 10000 \
            --out "$RUNNER_TEMP/throughput.json"

      - name: Compare against committed baseline (informational)
        shell: bash
        run: |
          python3 .github/workflows/compare_benchmarks.py \
            benchmarks/throughput_benchmark.json \
            "$RUNNER_TEMP/throughput.json" \
            --threshold 0.8

      - name: Schema smoke — workloads present, medians positive
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/throughput.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              artifact = json.load(handle)
          workloads = artifact["Workloads"]
          expected = {
              "micro_raw_2agent",
              "facility_static_4agent",
              "dynamic_contention_4agent",
              "stress_topology_4agent",
              "policy_lookahead_mcts_32",
          }
          names = {workload["Name"] for workload in workloads}
          assert names == expected, f"workload matrix mismatch: {sorted(names)}"
          for workload in workloads:
              assert workload["MedianThroughputPerSecond"] > 0
              assert workload["MedianStepLatencyMicros"] > 0
          assert artifact["Metadata"]["RamBytes"] > 0
          print(
              f"schema smoke passed: {len(workloads)} workloads, "
              f"all medians positive"
          )
          PY